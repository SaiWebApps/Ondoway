name: ondoway
description: "Ondoway — GPS-triggered audio walking tours"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  go_router: ^14.0.0
  provider: ^6.1.0
  google_sign_in: ^6.2.0
  flutter_secure_storage: ^9.2.0
  app_links: ^6.3.0
  speech_to_text: ^7.0.0
  geolocator: ^13.0.2
  sign_in_with_apple: ^6.1.0
  apple_maps_flutter: ^1.4.0
  just_audio: ^0.9.40
  # Phase 7 S7.9 (W7.2 R5): the audio session — background spoken playback and
  # the interruption events; just_audio's own session library, now used directly.
  audio_session: ^0.1.25
  # Phase 8 S8.7 (persona 09, Fiona & Dev step 4): the LOCK SCREEN's transport —
  # what is playing, and a pause button that reaches a pocketed phone. Without it
  # the phone must be unlocked and the app opened to stop a voice in your ear.
  just_audio_background: ^0.0.1-beta.17
  path_provider: ^2.1.0
  # The family invite renders as a QR beside the shareable link (docs/adr/0005:
  # "the QR serves the family standing in the same room"). Pure-Dart renderer —
  # no platform channel, no new .swift file.
  qr_flutter: ^4.1.0
  # The invite link rides the platform share sheet — a ~250-char URL is for
  # sending, not selecting. The Flutter-community standard share plugin.
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Phase 5 W5.12: the kill criterion is measured ON the iOS Simulator.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
  # The v10 design system's three faces, bundled rather than fetched so the app
  # renders identically offline and on first launch. Fraunces is the display
  # voice, Space Grotesk the body, Space Mono the numeric/monospace one.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Space Mono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
