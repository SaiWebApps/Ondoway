[project]
name = "ondoway-neo4j"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=6.1,<7.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "shapely>=2.0",
    "requests>=2.31",
    "datasketch>=1.6.4,<2.0",
    "rapidfuzz>=3.0,<4.0",
    "anthropic>=0.39,<1.0",
    "pyjwt[crypto]>=2.8",
    "google-auth>=2.29",
    "slowapi>=0.1.9",
    "email-validator>=2.1",
    "opening-hours-py==2.1.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "playwright>=1.40",
]
aws = [
    "boto3>=1.34",
]
dev = [
    "ruff>=0.4",
]

# Pin the package index so resolution is identical on every machine, regardless
# of any machine-level uv config (e.g. a corporate ~/.config/uv/uv.toml default).
# Regular (default) is public PyPI; `make sync-apple` overrides this via
# UV_DEFAULT_INDEX when on a network that only allows the Apple mirror.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # Depends() in FastAPI defaults is the correct pattern
    "E402",    # conftest.py must pin/scrub process env before imports
    "E741",    # `l` for Lens in Cypher queries is clear in context
]

[tool.ruff.lint.per-file-ignores]
"tests/test_workbench_ui.py" = ["E501"]  # Inline JS strings exceed 100 chars

[tool.pytest.ini_options]
testpaths = ["tests"]
# Dedicated files are ignored—not marker-deselected—in the hermetic Python
# shard. `make test` runs each explicit manifest through its own target.
addopts = """
--ignore=tests/test_workbench_ui.py
--ignore=tests/test_audio_functional.py
--ignore=tests/test_audio_says_story.py
--ignore=tests/test_magic_link_live.py
--ignore=tests/test_narration_coherence.py
--ignore=tests/test_tour_golden_ile.py
--ignore=tests/test_tour_golden_pdv.py
--ignore=tests/test_tour_audit.py
--ignore=tests/test_tour_grade.py
--ignore=tests/test_tour_invariants_live.py
"""
markers = [
    "live: hits live external services with real credentials; routed by `make test` through `make test-live`.",
    "requires_resend: live test that requires MAGIC_LINK_PROVIDER=resend and RESEND_API_KEY.",
    "golden: compares live dev-graph tours with the human-curated targets; routed internally by `make test`.",
    "grade: scores live dev-graph golden tours against GRADE_BASELINE; routed internally by `make test`.",
    "invariants: generates live dev-graph tours and checks customer-facing regression invariants; routed internally by `make test`.",
    "needs_db: auto-applied to tests using a Neo4j fixture; used by the Makefile to split DB and pure shards for parallel execution.",
]
