<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rewrites — review</title>
<style>
  :root {
    --ink: #16233a; --muted: #61708a; --line: #dfe4ec; --ground: #f7f8fa;
    --card: #ffffff; --brand: #2c6cc0; --warn: #b4541f; --bad: #a32b2b; --good: #2e7d54;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 32px 96px;
    font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--ground);
  }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; }
  h1 { font-size: 19px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  select { font: inherit; padding: 5px 9px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--card); }
  .sub { color: var(--muted); font-size: 13px; }
  .tally { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  .tally b { color: var(--ink); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 14px; max-width: 1100px;
  }
  .card.decided { opacity: .5; }
  .head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .poi { font-weight: 650; }
  .pill {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: #eef1f6; color: var(--muted);
  }
  .pill.flag { background: #fbe9e9; color: var(--bad); }
  .pill.ok { background: #e6f2ec; color: var(--good); }
  .pill.done { background: var(--brand); color: #fff; }
  .texts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .texts h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 0 0 5px; font-weight: 600;
  }
  .before { color: var(--muted); }
  .source {
    margin-top: 12px; padding: 10px 12px; background: #f7f8fa;
    border-left: 3px solid var(--line); border-radius: 0 6px 6px 0;
    font-size: 13.5px; color: var(--muted);
  }
  .doubt {
    margin-top: 10px; padding: 9px 12px; background: #fdf3e8;
    border-radius: 6px; font-size: 13.5px; color: var(--warn);
  }
  .doubt p { margin: 4px 0 0; }
  .actions { margin-top: 14px; display: flex; gap: 8px; align-items: center; }
  button {
    font: inherit; font-size: 14px; padding: 6px 16px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--card); cursor: pointer;
  }
  button.approve { border-color: var(--good); color: var(--good); }
  button.reject { border-color: var(--bad); color: var(--bad); }
  button:hover { background: #f2f5f9; }
  button:disabled { opacity: .45; cursor: default; }
  .err { color: var(--bad); }
  @media (max-width: 860px) { .texts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Rewrites</h1>
  <select id="city"></select>
  <span class="sub" id="who"></span>
</header>
<p class="tally" id="tally"></p>
<div id="queue"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let state = { city: "paris", candidates: [], summary: {}, reviewer: "" };

function card(row) {
  const decided = row.decision;
  const auto = String(row.decided_by || "").startsWith("auto:");
  const pill = decided
    ? `<span class="pill ${auto ? "ok" : "done"}">${esc(decided)}d ${
        auto ? "by both models" : "by " + esc(row.decided_by)}</span>`
    : `<span class="pill flag">needs you</span>`;

  const v = row.verified || {};
  const doubts = v.reason
    ? `<div class="doubt"><strong>Two models checked this and could not settle it.</strong>
         <p>${esc(v.reason)}</p></div>`
    : !row.verified
      ? `<div class="doubt">Not yet machine-verified.</div>`
      : "";

  return `<div class="card ${decided ? "decided" : ""}" id="c-${esc(row.beat_id)}">
    <div class="head">
      <span class="poi">${esc(row.poi_name)}</span>
      ${pill}
      <span class="sub">${Math.round(row.ratio_before * 100)}% copied →
        ${Math.round(row.ratio_after * 100)}%</span>
    </div>
    <div class="texts">
      <div><h3>Before — lifted from the book</h3><div class="before">${esc(row.body_before)}</div></div>
      <div><h3>After — rewritten</h3><div>${esc(row.body_after)}</div></div>
    </div>
    <div class="source"><strong>Source:</strong> ${esc(row.source_passage)}</div>
    ${doubts}
    <div class="actions">
      <button class="approve" onclick="decide('${esc(row.beat_id)}','approve')"
        ${decided ? "disabled" : ""}>Approve</button>
      <button class="reject" onclick="decide('${esc(row.beat_id)}','reject')"
        ${decided ? "disabled" : ""}>Reject</button>
      <span class="sub">${esc(row.beat_id)}</span>
    </div>
  </div>`;
}

function render() {
  const s = state.summary;
  const clean = state.source === "cleanroom";
  const link = (q) => `?city=${encodeURIComponent(state.city)}&source=${q}`;
  $("tally").innerHTML =
    `<b>${s.needs_a_person ?? 0}</b> need you · <b>${s.rejected}</b> rejected ·
     ${s.total} ${clean ? "clean-room bodies" : "rewrites"}` +
    (clean ? "" : ` · <b>${s.auto_approved ?? 0}</b> settled by two models`) +
    (!clean && s.unverified ? ` · ${s.unverified} not yet verified` : "") +
    (s.stale ? ` · <span class="err">${s.stale} approval(s) went stale</span>` : "") +
    ` · <a href="${link(state.source)}&show=all">show all</a>` +
    ` · <a href="${link(clean ? "rewrite" : "cleanroom")}">${clean ? "rewrites" : "clean-room bodies"}</a>`;
  $("who").textContent = `decisions recorded as ${state.reviewer}`;
  $("queue").innerHTML = state.candidates.map(card).join("");
}

async function decide(beatId, decision) {
  const res = await fetch("/api/reauthored/decision", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ city: state.city, beat_id: beatId, decision, source: state.source }),
  });
  const data = await res.json();
  if (!res.ok) { alert(data.error || "failed"); return; }
  const row = state.candidates.find((c) => c.beat_id === beatId);
  Object.assign(row, data.decided);
  state.summary = data.summary;
  render();
}

async function load(city) {
  state.city = city;
  $("queue").innerHTML = `<p class="sub">Reading ${esc(city)}…</p>`;
  const params = new URLSearchParams(location.search);
  const showAll = params.get("show") === "all";
  state.source = params.get("source") === "cleanroom" ? "cleanroom" : "rewrite";
  const res = await fetch(`/api/reauthored?city=${encodeURIComponent(city)}`
    + `&source=${state.source}` + (showAll ? "&show=all" : ""));
  const data = await res.json();
  state = { ...state, ...data };
  if ($("city").options.length === 0) {
    const corpus = await (await fetch(`/api/corpus?city=${encodeURIComponent(city)}`)).json();
    $("city").innerHTML = corpus.cities
      .map((c) => `<option ${c === city ? "selected" : ""}>${esc(c)}</option>`).join("");
  }
  if (!state.candidates.length) {
    $("queue").innerHTML = `<p class="sub">Nothing needs you in ${esc(city)}. Generate or verify with
      <code>ONDOWAY_DEMO_APPROVE=1 uv run python scripts/reauthor_run.py --city ${esc(city)}</code>.</p>`;
    $("tally").textContent = "";
    return;
  }
  render();
}

$("city").addEventListener("change", (e) => load(e.target.value));
load(new URLSearchParams(location.search).get("city") || "paris");
</script>
</body>
</html>
