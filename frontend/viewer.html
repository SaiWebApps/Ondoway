<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ondoway — Content Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script src="https://unpkg.com/leaflet-editable@1.2.0/src/Leaflet.Editable.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: #1a1a1a; border-bottom: 1px solid #333; flex-shrink: 0; }
  header h1 { font-size: 16px; font-weight: 600; color: #fff; white-space: nowrap; }
  header select { background: #2a2a2a; color: #e0e0e0; border: 1px solid #444; padding: 6px 12px; border-radius: 6px; font-size: 14px; }
  .stats { font-size: 13px; color: #888; margin-left: auto; }

  /* Edit mode toggle */
  .edit-toggle { background: #2a2a2a; color: #e0e0e0; border: 1px solid #444; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .edit-toggle:hover { background: #333; }
  .edit-toggle.active { background: #e67e22; border-color: #e67e22; color: #fff; }
  body.edit-mode #map { cursor: crosshair; }

  /* Marker dot */
  .poi-dot { border-radius: 50%; border: 1px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.4); box-sizing: border-box; }
  body.edit-mode .poi-dot { cursor: grab; box-shadow: 0 0 0 2px rgba(230,126,34,0.5); }
  body.edit-mode .poi-dot:active { cursor: grabbing; }

  /* Save toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #e0e0e0; border: 1px solid #333; border-radius: 6px; padding: 10px 18px; font-size: 13px; z-index: 9999; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.success { border-color: #2d6a4f; color: #8dca8d; }
  .toast.error { border-color: #6a2d2d; color: #e88b8b; }

  /* Main layout */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* Map */
  #map { flex: 1; min-width: 0; }

  /* Side panel */
  .panel { width: 0; overflow-y: auto; background: #1a1a1a; border-left: 1px solid #333; transition: width 0.2s ease; flex-shrink: 0; }
  .panel.open { width: 420px; }
  .panel-inner { padding: 20px; width: 420px; }

  .panel-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .panel-header h2 { font-size: 18px; font-weight: 600; color: #fff; line-height: 1.3; }
  .close-btn { background: none; border: none; color: #888; font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1; }
  .close-btn:hover { color: #fff; }

  .poi-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge-tier { background: #1e3a5f; color: #5b9bd5; }
  .badge-beats { background: #2d1f3d; color: #b48eda; }
  .badge-kid { background: #1f3d2d; color: #6dca8d; }

  .poi-desc { font-size: 13px; color: #999; line-height: 1.5; margin-bottom: 12px; }

  .gmaps-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #5b9bd5; text-decoration: none; padding: 6px 12px; border: 1px solid #334; border-radius: 6px; margin-bottom: 20px; }
  .gmaps-link:hover { background: #1e3a5f; }

  .beats-section h3 { font-size: 13px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px; }

  .beat-card { background: #222; border: 1px solid #333; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .beat-lens { font-size: 11px; font-weight: 600; color: #e67e22; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .beat-body { font-size: 14px; line-height: 1.6; color: #ccc; }
  .beat-meta { display: flex; gap: 12px; margin-top: 8px; font-size: 12px; color: #666; }

  /* Loading */
  .loading { display: flex; align-items: center; justify-content: center; height: 100%; color: #666; font-size: 14px; }
  .spinner { width: 20px; height: 20px; border: 2px solid #333; border-top-color: #888; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Empty state */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #555; text-align: center; gap: 8px; }
  .empty-state .icon { font-size: 48px; opacity: 0.3; }

  /* Area type badges */
  .badge-district { background: #1e3a5f; color: #5b9bd5; }
  .badge-neighborhood { background: #1f3d2d; color: #6dca8d; }
  .badge-island { background: #3d2d1f; color: #e6a85c; }
  .badge-corridor { background: #2d1f3d; color: #b48eda; }
  .badge-city { background: #2a2a2a; color: #888; }

  /* Beat source badges */
  .beat-source { font-size: 10px; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
  .beat-source-area { background: #3d2d1f; color: #e6a85c; }
  .beat-source-poi { background: #1e3a5f; color: #5b9bd5; }

  /* Content items (sub-areas / POIs in area panel) */
  .content-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border: 1px solid #333; border-radius: 6px; margin-bottom: 6px; cursor: pointer; font-size: 13px; }
  .content-item:hover { background: #2a2a2a; }
  .content-item .item-name { color: #e0e0e0; }
  .content-item .item-meta { color: #666; font-size: 11px; }

  /* Parent navigation link */
  .parent-link { font-size: 12px; color: #5b9bd5; cursor: pointer; margin-bottom: 12px; display: inline-block; }
  .parent-link:hover { text-decoration: underline; }

  /* Contents section heading */
  .contents-section h3 { font-size: 13px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px; }
  .collapsed { display: none; }

  /* Leaflet-editable vertex handles */
  .leaflet-vertex-icon { width: 10px !important; height: 10px !important; margin-left: -5px !important; margin-top: -5px !important; background: #e67e22 !important; border: 2px solid #fff !important; border-radius: 50% !important; }
  .leaflet-middle-icon { width: 8px !important; height: 8px !important; margin-left: -4px !important; margin-top: -4px !important; background: #888 !important; border: 1px solid #ccc !important; border-radius: 50% !important; opacity: 0.6 !important; }
</style>
</head>
<body>

<header>
  <h1>Ondoway Content Viewer</h1>
  <select id="citySelect">
    <option value="">Select a city…</option>
  </select>
  <button class="edit-toggle" id="editToggle" title="Toggle edit mode — drag pins to correct POI positions">✏️ Edit positions</button>
  <div class="stats" id="stats"></div>
</header>
<div class="toast" id="toast"></div>

<div class="main">
  <div id="map">
    <div class="empty-state" id="emptyState">
      <div class="icon">🗺️</div>
      <div>Select a city to view its content</div>
    </div>
  </div>
  <div class="panel" id="panel">
    <div class="panel-inner" id="panelInner"></div>
  </div>
</div>

<script>
// ── API base URL ──
// Port-configurable via ?apiPort= (default 8000), the same reader
// review.html and onboard.html carry, so a lane's viewer points at that
// lane's own API instead of whatever holds :8000.
const API = (() => {
  const raw = new URLSearchParams(location.search).get('apiPort');
  const port = raw && /^\d{2,5}$/.test(raw) ? raw : '8000';
  return `http://localhost:${port}/api/v1`;
})();

// State
let map = null;
let markers = [];
let allPois = [];
let beatCache = {};  // "citySlug:poiName" -> beats array
let currentCitySlug = 'paris';  // set per selected city; used for city-scoped beat queries
let selectedPoi = null;
let editMode = false;
let allAreas = [];
let areaPolygons = L.layerGroup();
let selectedArea = null;
let parentAreaStack = [];

// ── Toast ──
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => { t.className = 'toast'; }, 2800);
}

// ── Helpers ──

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function escAttr(s) {
  return esc(s).replace(/'/g, '&#39;');
}

function lensLabel(slug) {
  return (slug || 'unknown').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function parseWkt(wktStr) {
  try {
    const inner = wktStr.match(/POLYGON\(\((.+)\)\)/)?.[1];
    if (!inner) return null;
    return inner.split(',').map(pair => {
      const [lng, lat] = pair.trim().split(/\s+/).map(Number);
      return [lat, lng];  // Leaflet uses [lat, lng]
    });
  } catch (e) {
    console.warn('WKT parse failed:', e);
    return null;
  }
}

function toWkt(latlngs) {
  // latlngs is an array of [lat, lng] — convert to WKT POLYGON((lng lat, ...))
  const ring = latlngs[0] || latlngs; // handle nested array from Leaflet
  const coords = ring.map(ll => `${ll.lng.toFixed(6)} ${ll.lat.toFixed(6)}`);
  // Close the ring if not already closed
  if (coords[0] !== coords[coords.length - 1]) coords.push(coords[0]);
  return `POLYGON((${coords.join(', ')}))`;
}

const AREA_COLORS = {
  city:         { color: '#666', fillColor: 'transparent', weight: 1, dashArray: '8 4', interactive: false },
  district:     { color: '#5b9bd5', fillColor: 'rgba(70,130,180,0.15)', weight: 2 },
  neighborhood: { color: '#6dca8d', fillColor: 'rgba(100,200,100,0.12)', weight: 2 },
  island:       { color: '#e6a85c', fillColor: 'rgba(230,168,92,0.18)', weight: 2 },
  corridor:     { color: '#b48eda', fillColor: 'rgba(180,100,220,0.18)', weight: 2 },
};

// Render order: city first (back), districts, then neighborhoods/islands/corridors on top
const AREA_TYPE_ORDER = { city: 0, district: 1, neighborhood: 2, island: 2, corridor: 2 };

// ── City loading ──

async function loadCities() {
  // Discover cities by fetching all POIs and extracting unique cities from coordinates
  // For now, hardcode known cities — this can be made dynamic later
  const cities = [
    { name: 'Paris', slug: 'paris', lat: 48.8566, lng: 2.3522, zoom: 13 },
    { name: 'New York', slug: 'new_york', lat: 40.7128, lng: -73.9500, zoom: 11, span: 0.40 },
  ];
  const sel = document.getElementById('citySelect');
  cities.forEach(c => {
    const opt = document.createElement('option');
    opt.value = JSON.stringify(c);
    opt.textContent = c.name;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => {
    if (sel.value) loadCity(JSON.parse(sel.value));
  });
}

async function loadCity(city) {
  // Init map if needed
  const mapEl = document.getElementById('map');
  currentCitySlug = city.slug || city.name.toLowerCase();
  document.getElementById('emptyState')?.remove();

  if (!map) {
    map = L.map('map', { zoomControl: true, editable: true }).setView([city.lat, city.lng], city.zoom);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap © CARTO',
      maxZoom: 19
    }).addTo(map);
    // Custom panes for area layering: city behind districts behind smaller areas
    map.createPane('areaCity').style.zIndex = 350;
    map.createPane('areaDistrict').style.zIndex = 360;
    map.createPane('areaDetail').style.zIndex = 370;
  } else {
    map.setView([city.lat, city.lng], city.zoom);
  }

  // Clear existing
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  allPois = [];
  beatCache = {};
  selectedPoi = null;
  selectedArea = null;
  parentAreaStack = [];
  areaPolygons.clearLayers();
  allAreas = [];
  closePanel();

  document.getElementById('stats').textContent = 'Loading…';

  // Fetch all POIs (paginate)
  let skip = 0;
  let total = 0;
  do {
    const resp = await fetch(`${API}/nodes/POI?limit=200&skip=${skip}`);
    const data = await resp.json();
    allPois.push(...data.items);
    total = data.total;
    skip += 200;
  } while (skip < total);

  // Filter to city bounds. Default ~0.15 degrees (~15km, fine for Paris); larger
  // cities override via `city.span` (NYC's five boroughs span ~0.45 degrees).
  const span = city.span ?? 0.15;
  const cityPois = allPois.filter(p => {
    const loc = p.properties?.location;
    const lat = loc?.lat ?? p.properties?.latitude;
    const lng = loc?.lng ?? p.properties?.longitude;
    return lat && lng && Math.abs(lat - city.lat) < span && Math.abs(lng - city.lng) < span;
  });
  allPois = cityPois;

  // Fetch total beat count
  let totalBeats = 0;
  try {
    const beatResp = await fetch(`${API}/nodes/NarrativeBeat?limit=1&skip=0`);
    const beatData = await beatResp.json();
    totalBeats = beatData.total || 0;
  } catch (e) {}

  // Add markers
  allPois.forEach((poi, idx) => {
    const props = poi.properties;
    const loc = props.location;
    const lat = loc?.lat ?? props.latitude;
    const lng = loc?.lng ?? props.longitude;
    if (!lat || !lng) return;

    const tier = props.importance_tier || 3;
    const diameter = tier >= 4 ? 16 : tier >= 3 ? 12 : 8;
    const color = tier >= 5 ? '#e74c3c' : tier >= 4 ? '#e67e22' : tier >= 3 ? '#f1c40f' : tier >= 2 ? '#5b9bd5' : '#888';

    const icon = L.divIcon({
      className: '',
      html: `<div class="poi-dot" style="width:${diameter}px;height:${diameter}px;background:${color};opacity:0.85;"></div>`,
      iconSize: [diameter, diameter],
      iconAnchor: [diameter / 2, diameter / 2]
    });

    const marker = L.marker([lat, lng], {
      icon: icon,
      draggable: editMode,
      autoPan: true
    }).addTo(map);

    marker.bindTooltip(esc(props.name), {
      direction: 'top',
      offset: [0, -diameter / 2 - 2],
      className: 'poi-tooltip'
    });

    marker.on('click', () => {
      if (!editMode) selectPoi(idx);
    });

    marker.on('dragend', async (e) => {
      const { lat: newLat, lng: newLng } = e.target.getLatLng();
      const oldLat = loc?.lat ?? props.latitude;
      const oldLng = loc?.lng ?? props.longitude;
      try {
        const resp = await fetch(`${API}/nodes/POI/${poi.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ properties: { latitude: newLat, longitude: newLng } })
        });
        if (!resp.ok) throw new Error(`${resp.status} ${await resp.text()}`);
        // Update local state so further drags use fresh base
        if (poi.properties.location) {
          poi.properties.location = { lat: newLat, lng: newLng };
        }
        poi.properties.latitude = newLat;
        poi.properties.longitude = newLng;
        showToast(`Saved: ${props.name} → ${newLat.toFixed(5)}, ${newLng.toFixed(5)}`, 'success');
      } catch (err) {
        console.error('Save failed', err);
        // Revert marker to original position
        marker.setLatLng([oldLat, oldLng]);
        showToast(`Save failed: ${props.name}`, 'error');
      }
    });

    markers.push(marker);
  });

  // Fit bounds
  if (markers.length > 0) {
    const group = L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.1));
  }

  // Load Areas
  try {
    let areaSkip = 0;
    let areaTotal = 0;
    let rawAreas = [];
    do {
      const resp = await fetch(`${API}/nodes/Area?limit=200&skip=${areaSkip}`);
      const data = await resp.json();
      rawAreas.push(...data.items);
      areaTotal = data.total;
      areaSkip += 200;
    } while (areaSkip < areaTotal);

    // Areas may store city_name as the slug ('new_york') or the display name ('Paris');
    // match either, case-insensitively, against both the city slug and display name.
    const cityKeys = new Set([city.slug, city.name].filter(Boolean).map(s => s.toLowerCase()));
    allAreas = rawAreas.filter(a => cityKeys.has((a.properties?.city_name || '').toLowerCase()));

    // Sort: city first (back), then districts, then smaller areas on top
    const sorted = [...allAreas].sort((a, b) => {
      const orderA = AREA_TYPE_ORDER[a.properties?.area_type] ?? 2;
      const orderB = AREA_TYPE_ORDER[b.properties?.area_type] ?? 2;
      return orderA - orderB;
    });

    sorted.forEach(area => {
      const boundary = area.properties?.boundary;
      if (!boundary) return;
      const coords = parseWkt(boundary);
      if (!coords) return;

      const areaType = area.properties?.area_type || 'neighborhood';
      const style = AREA_COLORS[areaType] || AREA_COLORS.neighborhood;

      const pane = areaType === 'city' ? 'areaCity' : areaType === 'district' ? 'areaDistrict' : 'areaDetail';

      const polygon = L.polygon(coords, {
        color: style.color,
        fillColor: style.fillColor,
        fillOpacity: 1,
        weight: style.weight,
        dashArray: style.dashArray || null,
        interactive: style.interactive !== false,
        pane: pane,
      });

      if (style.interactive !== false) {
        polygon.bindTooltip(esc(area.properties.name), {
          direction: 'center',
          className: 'poi-tooltip'
        });

        polygon.on('click', () => {
          if (!editMode) selectArea(area);
        });

        // Auto-save on vertex drag in edit mode
        polygon.on('editable:vertex:dragend', async () => {
          const wkt = toWkt(polygon.getLatLngs());
          try {
            const resp = await fetch(`${API}/nodes/Area/${area.id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ properties: { boundary: wkt } })
            });
            if (!resp.ok) throw new Error(`${resp.status} ${await resp.text()}`);
            area.properties.boundary = wkt;
            showToast(`Saved boundary: ${area.properties.name}`, 'success');
          } catch (err) {
            console.error('Boundary save failed', err);
            showToast(`Save failed: ${area.properties.name}`, 'error');
          }
        });
      }

      polygon._areaData = area;
      areaPolygons.addLayer(polygon);
    });

    areaPolygons.addTo(map);
  } catch (e) {
    console.warn('Failed to load areas:', e);
  }

  document.getElementById('stats').textContent = `${allPois.length} POIs · ${allAreas.length} areas · ${totalBeats} beats`;
}

// ── POI selection ──

async function selectPoi(idx) {
  const poi = allPois[idx];
  if (!poi) return;
  selectedPoi = poi;

  // Highlight marker (add a wrapper class on the icon div)
  markers.forEach((m, i) => {
    const el = m.getElement();
    if (!el) return;
    const dot = el.querySelector('.poi-dot');
    if (!dot) return;
    if (i === idx) {
      dot.style.boxShadow = '0 0 0 3px rgba(255,255,255,0.9), 0 0 12px rgba(255,255,255,0.6)';
      dot.style.transform = 'scale(1.3)';
    } else {
      dot.style.boxShadow = '';
      dot.style.transform = '';
    }
  });

  const props = poi.properties;
  const name = props.name;

  // Show loading in panel
  openPanel();
  document.getElementById('panelInner').innerHTML = `
    <div class="panel-header">
      <h2>${esc(name)}</h2>
      <button class="close-btn" onclick="closePanel()">×</button>
    </div>
    <div class="loading"><div class="spinner"></div>Loading beats…</div>
  `;

  // Fetch beats (with cache) — scoped to the selected city
  const cacheKey = `${currentCitySlug}:${name}`;
  let beats = beatCache[cacheKey];
  if (!beats) {
    try {
      const resp = await fetch(`${API}/graph/poi/${encodeURIComponent(name)}/beats?city_name=${encodeURIComponent(currentCitySlug)}`);
      const data = await resp.json();
      beats = data.beats || [];
      beatCache[cacheKey] = beats;
    } catch (e) {
      beats = [];
      document.getElementById('panelInner').innerHTML = `
        <div class="panel-header">
          <h2>${esc(name)}</h2>
          <button class="close-btn" onclick="closePanel()">×</button>
        </div>
        <div style="color:#e74c3c;padding:20px;">Failed to load beats. Is the backend running?</div>
      `;
      return;
    }
  }

  // Check if this POI is still selected (user may have clicked another)
  if (selectedPoi !== poi) return;

  renderPoiDetail(poi, beats);
}

function renderPoiDetail(poi, beats) {
  const props = poi.properties;
  const loc = props.location;
  const lat = loc?.lat ?? props.latitude;
  const lng = loc?.lng ?? props.longitude;
  const gmapsUrl = `https://www.google.com/maps?q=${lat},${lng}`;
  const tier = props.importance_tier || '?';
  const kidFriendly = props.kid_friendly === 'yes';

  let beatsHtml = '';
  if (beats.length === 0) {
    beatsHtml = '<div style="color:#666;font-style:italic;padding:12px 0;">No beats yet</div>';
  } else {
    beats.forEach(b => {
      const lens = b.lens_slug || b.lens || '';
      const body = b.script_body || '';
      const dur = b.duration_sec || 0;
      const words = body.split(/\s+/).length;
      beatsHtml += `
        <div class="beat-card">
          <div class="beat-lens">${esc(lensLabel(lens))}</div>
          <div class="beat-body">${esc(body)}</div>
          <div class="beat-meta">
            <span>${dur}s</span>
            <span>${words} words</span>
            <span class="beat-source beat-source-poi">POI</span>
          </div>
        </div>
      `;
    });
  }

  document.getElementById('panelInner').innerHTML = `
    <div class="panel-header">
      <h2>${esc(props.name)}</h2>
      <button class="close-btn" onclick="closePanel()">×</button>
    </div>
    <div class="poi-meta">
      <span class="badge badge-tier">Gravity ${esc(String(tier))}</span>
      <span class="badge badge-beats">${beats.length} beat${beats.length !== 1 ? 's' : ''}</span>
      ${kidFriendly ? '<span class="badge badge-kid">Kid friendly</span>' : ''}
    </div>
    ${props.short_description ? `<div class="poi-desc">${esc(props.short_description)}</div>` : ''}
    <a class="gmaps-link" href="${esc(gmapsUrl)}" target="_blank" rel="noopener">
      📍 Open in Google Maps
    </a>
    <div class="beats-section">
      <h3>Beats</h3>
      ${beatsHtml}
    </div>
  `;
}

function openPanel() {
  document.getElementById('panel').classList.add('open');
  setTimeout(() => map?.invalidateSize(), 250);
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  selectedPoi = null;
  selectedArea = null;
  parentAreaStack = [];
  markers.forEach(m => {
    const el = m.getElement();
    const dot = el?.querySelector('.poi-dot');
    if (dot) {
      dot.style.boxShadow = '';
      dot.style.transform = '';
    }
  });
  setTimeout(() => map?.invalidateSize(), 250);
}

// ── Area selection ──

async function selectArea(area) {
  selectedArea = area;
  selectedPoi = null;

  // Clear POI marker highlights
  markers.forEach(m => {
    const dot = m.getElement()?.querySelector('.poi-dot');
    if (dot) { dot.style.boxShadow = ''; dot.style.transform = ''; }
  });

  // Zoom to polygon bounds
  areaPolygons.eachLayer(layer => {
    if (layer._areaData === area) {
      map.fitBounds(layer.getBounds().pad(0.05));
    }
  });

  // Show loading in panel
  openPanel();
  document.getElementById('panelInner').innerHTML = `
    <div class="panel-header">
      <h2>${esc(area.properties.name)}</h2>
      <button class="close-btn" onclick="closePanel()">×</button>
    </div>
    <div class="loading"><div class="spinner"></div>Loading area…</div>
  `;

  try {
    const [beatsResp, contentsResp] = await Promise.all([
      fetch(`${API}/graph/area/${encodeURIComponent(area.properties.name)}/beats`),
      fetch(`${API}/graph/area/${encodeURIComponent(area.properties.name)}/contents`)
    ]);
    const beatsData = await beatsResp.json();
    const contentsData = await contentsResp.json();

    if (selectedArea !== area) return;
    renderAreaDetail(area, beatsData.beats || [], contentsData);
  } catch (e) {
    document.getElementById('panelInner').innerHTML = `
      <div class="panel-header">
        <h2>${esc(area.properties.name)}</h2>
        <button class="close-btn" onclick="closePanel()">×</button>
      </div>
      <div style="color:#e74c3c;padding:20px;">Failed to load area data. Is the backend running?</div>
    `;
  }
}

function renderAreaDetail(area, beats, contents) {
  const props = area.properties;
  const areaType = props.area_type || 'neighborhood';
  const subAreas = contents.sub_areas || [];
  const pois = contents.pois || [];

  // Parent link
  let parentHtml = '';
  if (parentAreaStack.length > 0) {
    const parent = parentAreaStack[parentAreaStack.length - 1];
    parentHtml = `<div class="parent-link" onclick="navigateToParent()">← ${esc(parent.properties.name)}</div>`;
  }

  // Beats HTML
  let beatsHtml = '';
  if (beats.length === 0) {
    beatsHtml = '<div style="color:#666;font-style:italic;padding:12px 0;">No beats</div>';
  } else {
    beats.forEach(b => {
      const lens = b.lens_slug || b.lens || '';
      const body = b.script_body || '';
      const dur = b.duration_sec || 0;
      const words = body.split(/\s+/).length;
      beatsHtml += `
        <div class="beat-card">
          <div class="beat-lens">${esc(lensLabel(lens))}</div>
          <div class="beat-body">${esc(body)}</div>
          <div class="beat-meta">
            <span>${dur}s</span>
            <span>${words} words</span>
            <span class="beat-source beat-source-area">Area</span>
          </div>
        </div>
      `;
    });
  }

  // Sub-areas HTML
  let subAreasHtml = '';
  if (subAreas.length > 0) {
    subAreasHtml = `<div class="contents-section"><h3>Sub-areas</h3>`;
    subAreas.forEach(sa => {
      subAreasHtml += `
        <div class="content-item" onclick="navigateToSubArea('${escAttr(sa.name)}')">
          <span class="item-name">${esc(sa.name)}</span>
          <span class="item-meta">${sa.beat_count || 0} beats</span>
        </div>
      `;
    });
    subAreasHtml += '</div>';
  }

  // POIs HTML — collapse behind toggle when sub-areas exist (avoids showing 181 POIs at city level)
  let poisHtml = '';
  if (pois.length > 0) {
    const collapsed = subAreas.length > 0;
    const toggleId = 'poi-list-' + Date.now();
    poisHtml = `<div class="contents-section">`;
    if (collapsed) {
      poisHtml += `<h3 class="toggle-header" onclick="document.getElementById('${toggleId}').classList.toggle('collapsed')" style="cursor:pointer;">Points of Interest (${pois.length}) ▸</h3>`;
      poisHtml += `<div id="${toggleId}" class="collapsed">`;
    } else {
      poisHtml += `<h3>Points of Interest</h3>`;
    }
    pois.forEach(p => {
      poisHtml += `
        <div class="content-item" onclick="navigateToContainedPoi('${escAttr(p.name)}')">
          <span class="item-name">${esc(p.name)}</span>
          <span class="item-meta">${p.beat_count || 0} beats</span>
        </div>
      `;
    });
    if (collapsed) poisHtml += '</div>';
    poisHtml += '</div>';
  }

  document.getElementById('panelInner').innerHTML = `
    <div class="panel-header">
      <h2>${esc(props.name)}</h2>
      <button class="close-btn" onclick="closePanel()">×</button>
    </div>
    ${parentHtml}
    <div class="poi-meta">
      <span class="badge badge-${esc(areaType)}">${esc(areaType)}</span>
      <span class="badge badge-beats">${beats.length} beat${beats.length !== 1 ? 's' : ''}</span>
      <span class="badge badge-beats">${pois.length} POI${pois.length !== 1 ? 's' : ''}</span>
    </div>
    ${props.short_description ? `<div class="poi-desc">${esc(props.short_description)}</div>` : ''}
    <div class="beats-section">
      <h3>Beats</h3>
      ${beatsHtml}
    </div>
    ${subAreasHtml}
    ${poisHtml}
  `;
}

function navigateToParent() {
  const parent = parentAreaStack.pop();
  if (parent) selectArea(parent);
}

function navigateToSubArea(name) {
  const subArea = allAreas.find(a => a.properties.name === name);
  if (subArea && selectedArea) {
    parentAreaStack.push(selectedArea);
    selectArea(subArea);
  }
}

function navigateToContainedPoi(name) {
  const idx = allPois.findIndex(p => p.properties.name === name);
  if (idx >= 0) {
    parentAreaStack = [];
    selectPoi(idx);
  }
}

// ── Edit mode ──
function toggleEditMode() {
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  document.getElementById('editToggle').classList.toggle('active', editMode);
  markers.forEach(m => {
    if (editMode) m.dragging?.enable();
    else m.dragging?.disable();
  });
  // Enable/disable polygon vertex editing
  areaPolygons.eachLayer(layer => {
    if (!layer._areaData) return;
    const areaType = layer._areaData.properties?.area_type;
    if (areaType === 'city') return; // city polygon not editable
    if (editMode) layer.enableEdit();
    else layer.disableEdit();
  });
  if (editMode) {
    showToast('Edit mode ON — drag pins or polygon vertices. Changes auto-save.', 'success');
  }
}
document.getElementById('editToggle').addEventListener('click', toggleEditMode);

// ── Tooltip styling (injected) ──
const style = document.createElement('style');
style.textContent = `
  .poi-tooltip { background: #1a1a1a !important; color: #e0e0e0 !important; border: 1px solid #444 !important; border-radius: 4px !important; padding: 4px 8px !important; font-size: 13px !important; font-weight: 500 !important; box-shadow: 0 2px 8px rgba(0,0,0,0.5) !important; }
  .poi-tooltip::before { border-top-color: #444 !important; }
`;
document.head.appendChild(style);

// ── Init ──
loadCities();
</script>
