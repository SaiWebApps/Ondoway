# Pin the compose project name so containers/volumes resolve identically from
# any checkout (main or a .claude/worktrees/* worktree). Without this, a
# worktree-run `make db-*-up` creates a parallel project named after the
# worktree directory, and the *-reset targets silently `rm -f` nonexistent
# ondoway_* volumes (docker volume rm -f exits 0 on a missing volume).
name: ondoway

# ── shared service templates ────────────────────────────────────────────────
# Every graph below is the same Neo4j with a different name, port, password and
# heap. Those four things are all a service should have to state. Anything
# spelled out per-service instead of anchored here drifts: the fleet ends up
# with two definitions of the same thing and a fix lands on only one of them.
x-neo4j: &neo4j
  image: neo4j:5

x-neo4j-env: &neo4j-env
  NEO4J_PLUGINS: '["apoc"]'

# The probe must not become the load. `cypher-shell` is a JVM, and on a busy
# machine it is SLOW: measured 21.5 s on 2026-08-29 while the bolt endpoint the
# suite actually uses answered the same `RETURN 1` in 0.25 s. Against the old
# 5 s timeout it could never finish, so every container respawned it every 5 s
# forever — nine JVM launches a second between them, 200% CPU per container with
# nothing querying, and each new JVM made the next one slower. Docker called
# every graph unhealthy and preflight refused to run, while all nine databases
# were answering queries the whole time.
#
# 30 s of headroom is roughly ten times the idle cost of the probe, and one JVM
# per 30 s is noise. start_period covers the ~20 s Neo4j spends starting, so a
# cold container is not marked unhealthy for booting.
x-neo4j-health: &neo4j-health
  interval: 30s
  timeout: 30s
  retries: 20
  start_period: 40s

# A graph holding a full city corpus (the parallel-lane pytest and dev graphs).
# Capped because these run alongside the uncapped canonical pair: an uncapped
# third JVM is what killed dockerd on 2026-07-02, and 768m/256m still seats a
# full pytest fixture corpus where the workbench's 512m/128m would not.
x-neo4j-heap-corpus: &neo4j-heap-corpus
  NEO4J_server_memory_heap_initial__size: 256m
  NEO4J_server_memory_heap_max__size: 768m
  NEO4J_server_memory_pagecache_size: 256m

# A graph holding the workbench's ~50-node per-run corpus.
x-neo4j-heap-small: &neo4j-heap-small
  NEO4J_server_memory_heap_initial__size: 256m
  NEO4J_server_memory_heap_max__size: 512m
  NEO4J_server_memory_pagecache_size: 128m

services:
  # ── canonical lane (the main checkout) ────────────────────────────────────
  neo4j:
    <<: *neo4j
    container_name: ondoway-neo4j
    ports:
      - "7474:7474"  # HTTP browser
      - "7687:7687"  # Bolt protocol
    environment:
      <<: *neo4j-env
      NEO4J_AUTH: neo4j/ondoway_dev_2026
    volumes:
      - neo4j_data:/data
    healthcheck:
      <<: *neo4j-health
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ondoway_dev_2026", "RETURN 1"]

  neo4j-test:
    <<: *neo4j
    container_name: ondoway-neo4j-test
    ports:
      - "7475:7474"  # HTTP browser (test)
      - "7688:7687"  # Bolt protocol (test)
    environment:
      <<: *neo4j-env
      NEO4J_AUTH: neo4j/ondoway_test_2026
    volumes:
      - neo4j_test_data:/data
    healthcheck:
      <<: *neo4j-health
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ondoway_test_2026", "RETURN 1"]

  # Dedicated instance for the Playwright workbench suite (make test-workbench)
  # and the manual workbench API (make api-test). NEVER shared with the pytest
  # suite: `make test`/`make test-local` full-wipe 7688 per-module, so any suite
  # asserting exact DB state on 7688 is broken by a concurrent run. The
  # workbench suite pre-wipes this instance in its seed fixture instead.
  neo4j-workbench:
    <<: *neo4j
    container_name: ondoway-neo4j-workbench
    ports:
      - "7476:7474"  # HTTP browser (workbench)
      - "7689:7687"  # Bolt protocol (workbench)
    environment:
      <<: [*neo4j-env, *neo4j-heap-small]
      NEO4J_AUTH: neo4j/ondoway_workbench_2026
    volumes:
      - neo4j_workbench_data:/data
    healthcheck:
      <<: *neo4j-health
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ondoway_workbench_2026", "RETURN 1"]

  # ── parallel lanes 2 and 3 (concurrent worktrees) ─────────────────────────
  # A lane owns every graph it writes, so two agents can run at once without
  # one wiping the other's fixtures: the pytest suite full-wipes its graph
  # per-module and the workbench suite pre-wipes its own, which turns any
  # sharing into phantom failures rather than a slow queue. Routing (Valhalla,
  # below) is deliberately NOT duplicated -- it is stateless read-only lookup
  # with no write conflict to protect against, and a copy would mean a second
  # 1.6 GB of identical tiles.
  neo4j-dev2:
    <<: *neo4j
    container_name: ondoway-neo4j-dev2
    ports:
      - "7479:7474"  # HTTP browser (lane 2 dev)
      - "7692:7687"  # Bolt protocol (lane 2 dev)
    environment:
      <<: [*neo4j-env, *neo4j-heap-corpus]
      NEO4J_AUTH: neo4j/ondoway_dev2_2026
    volumes:
      - neo4j_dev2_data:/data
    healthcheck:
      <<: *neo4j-health
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ondoway_dev2_2026", "RETURN 1"]

  neo4j-test2:
    <<: *neo4j
    container_name: ondoway-neo4j-test2
    ports:
      - "7477:7474"  # HTTP browser (lane 2 pytest)
      - "7690:7687"  # Bolt protocol (lane 2 pytest)
    environment:
      <<: [*neo4j-env, *neo4j-heap-corpus]
      NEO4J_AUTH: neo4j/ondoway_test2_2026
    volumes:
      - neo4j_test2_data:/data
    healthcheck:
      <<: *neo4j-health
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ondoway_test2_2026", "RETURN 1"]

  neo4j-workbench2:
    <<: *neo4j
    container_name: ondoway-neo4j-workbench2
    ports:
      - "7481:7474"  # HTTP browser (lane 2 workbench)
      - "7694:7687"  # Bolt protocol (lane 2 workbench)
    environment:
      <<: [*neo4j-env, *neo4j-heap-small]
      NEO4J_AUTH: neo4j/ondoway_workbench2_2026
    volumes:
      - neo4j_workbench2_data:/data
    healthcheck:
      <<: *neo4j-health
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ondoway_workbench2_2026", "RETURN 1"]

  neo4j-dev3:
    <<: *neo4j
    container_name: ondoway-neo4j-dev3
    ports:
      - "7480:7474"  # HTTP browser (lane 3 dev)
      - "7693:7687"  # Bolt protocol (lane 3 dev)
    environment:
      <<: [*neo4j-env, *neo4j-heap-corpus]
      NEO4J_AUTH: neo4j/ondoway_dev3_2026
    volumes:
      - neo4j_dev3_data:/data
    healthcheck:
      <<: *neo4j-health
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ondoway_dev3_2026", "RETURN 1"]

  neo4j-test3:
    <<: *neo4j
    container_name: ondoway-neo4j-test3
    ports:
      - "7478:7474"  # HTTP browser (lane 3 pytest)
      - "7691:7687"  # Bolt protocol (lane 3 pytest)
    environment:
      <<: [*neo4j-env, *neo4j-heap-corpus]
      NEO4J_AUTH: neo4j/ondoway_test3_2026
    volumes:
      - neo4j_test3_data:/data
    healthcheck:
      <<: *neo4j-health
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ondoway_test3_2026", "RETURN 1"]

  neo4j-workbench3:
    <<: *neo4j
    container_name: ondoway-neo4j-workbench3
    ports:
      - "7482:7474"  # HTTP browser (lane 3 workbench)
      - "7695:7687"  # Bolt protocol (lane 3 workbench)
    environment:
      <<: [*neo4j-env, *neo4j-heap-small]
      NEO4J_AUTH: neo4j/ondoway_workbench3_2026
    volumes:
      - neo4j_workbench3_data:/data
    healthcheck:
      <<: *neo4j-health
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ondoway_workbench3_2026", "RETURN 1"]

  # ── lane 4 (the multi-track sandbox lane, docs/adr/0002) ──────────────────
  # Owned outright by a second worktree; the definitive bar never consumes it
  # as a shard, so a sandbox session's fixtures cannot collide with the bar's.
  neo4j-dev4:
    <<: *neo4j
    container_name: ondoway-neo4j-dev4
    ports:
      - "7483:7474"  # HTTP browser (lane 4 dev)
      - "7696:7687"  # Bolt protocol (lane 4 dev)
    environment:
      <<: [*neo4j-env, *neo4j-heap-corpus]
      NEO4J_AUTH: neo4j/ondoway_dev4_2026
    volumes:
      - neo4j_dev4_data:/data
    healthcheck:
      <<: *neo4j-health
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ondoway_dev4_2026", "RETURN 1"]

  neo4j-test4:
    <<: *neo4j
    container_name: ondoway-neo4j-test4
    ports:
      - "7484:7474"  # HTTP browser (lane 4 pytest)
      - "7697:7687"  # Bolt protocol (lane 4 pytest)
    environment:
      <<: [*neo4j-env, *neo4j-heap-corpus]
      NEO4J_AUTH: neo4j/ondoway_test4_2026
    volumes:
      - neo4j_test4_data:/data
    healthcheck:
      <<: *neo4j-health
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ondoway_test4_2026", "RETURN 1"]

  neo4j-workbench4:
    <<: *neo4j
    container_name: ondoway-neo4j-workbench4
    ports:
      - "7485:7474"  # HTTP browser (lane 4 workbench)
      - "7698:7687"  # Bolt protocol (lane 4 workbench)
    environment:
      <<: [*neo4j-env, *neo4j-heap-small]
      NEO4J_AUTH: neo4j/ondoway_workbench4_2026
    volumes:
      - neo4j_workbench4_data:/data
    healthcheck:
      <<: *neo4j-health
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ondoway_workbench4_2026", "RETURN 1"]

  # M1 routing engine, shared by every lane. Never started by the db-* targets
  # (they are service-scoped); use `make valhalla-up`. First start builds tiles
  # from any .osm.pbf in ./valhalla/custom_files (`make valhalla-build-tiles`
  # downloads the Île-de-France extract there). Tiles live in the bind mount, so
  # `docker compose down -v` cannot destroy them.
  #
  # One instance is correct: routing is a stateless read-only lookup, so
  # concurrent lanes cannot corrupt each other through it. What a lane CAN do is
  # stop or restart it, which is why that is forbidden from a lane -- and why
  # VALHALLA_ROOT resolves to the main checkout, so a worktree cannot start a
  # second engine against an empty tile directory.
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    container_name: ondoway-valhalla
    ports:
      - "8002:8002"
    volumes:
      - ./valhalla/custom_files:/custom_files
    healthcheck:
      # GET /status answers 200 + version when the service is up (documented
      # health endpoint). Best-effort: not yet validated against the image's
      # installed binaries; `make valhalla-status` is the host-side check.
      test: ["CMD-SHELL", "curl -fs http://localhost:8002/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
  neo4j_test_data:
  neo4j_workbench_data:
  neo4j_dev2_data:
  neo4j_test2_data:
  neo4j_workbench2_data:
  neo4j_dev3_data:
  neo4j_test3_data:
  neo4j_workbench3_data:
  neo4j_dev4_data:
  neo4j_test4_data:
  neo4j_workbench4_data:
